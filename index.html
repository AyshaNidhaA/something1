    if(!audioContext){

                window.webkitAudioContext
            )();

    }

}


/* BUTTON CLICK SOUND */

function buttonSound(){

    createAudio();

    var oscillator =
        audioContext.createOscillator();

    var gain =
        audioContext.createGain();


    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );

    gain.gain.setValueAtTime(

    );


    gain.gain.exponentialRampToValueAtTime(
        0.01,
        audioContext.currentTime + 0.08
    );


    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + 0.08
    );

}

var musicTimer;

var musicNotes =

        392.00,
        329.63,
        293.66,
        349.23,
        440.00,
        349.23
    ];

var musicIndex = 0;



function playMusicNote(){

    if(
        !musicPlaying ||
        !audioContext
    ){

        return;

    }


    var oscillator =
        audioContext.createOscillator();

    var gain =
        audioContext.createGain();


    oscillator.type = "sine";


    oscillator.frequency.value =
        musicNotes[musicIndex];


    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );


    gain.gain.setValueAtTime(
        0.035,
        audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.35
    );


    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + 0.35
    );


    musicIndex++;

    if(musicIndex >= musicNotes.length){

        musicIndex = 0;

    }

}

    createAudio();


    if(audioContext.state === "suspended"){

        audioContext.resume();

    musicPlaying = true;

    musicTimer =

            450

function checkCatch(mango){

    var mangoRect =
        mango.getBoundingClientRect();


    var basketRect =
        basket.getBoundingClientRect();


    if(

        mangoRect.right >=
        basketRect.left

        &&

        mangoRect.left <=
        basketRect.right

        &&

        mangoRect.bottom >=
        basketRect.top

        &&

        mangoRect.top <=
        basketRect.bottom

    ){

        return true;

    }


    return false;

}
